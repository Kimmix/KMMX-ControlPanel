name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if that's your default branch
  workflow_dispatch:  # Allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current date and version
        id: date
        run: |
          echo "BUILD_DATE=$(date +'%B %d, %Y')" >> $GITHUB_OUTPUT
          echo "CACHE_VERSION=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install minification tools
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Update service worker cache version
        run: |
          CACHE_VER="${{ steps.date.outputs.CACHE_VERSION }}"
          sed -i "s/const CACHE_NAME = 'kmmx-control-v[^']*'/const CACHE_NAME = 'kmmx-control-$CACHE_VER'/g" sw.js
          sed -i "s/const RUNTIME_CACHE = 'kmmx-runtime-v[^']*'/const RUNTIME_CACHE = 'kmmx-runtime-$CACHE_VER'/g" sw.js
          sed -i "s/\/\/ Version [0-9.]\+/\/\/ Version $CACHE_VER/g" sw.js
          echo "Cache version updated to: $CACHE_VER"

      - name: Check file sizes before minification
        run: |
          echo "=== File sizes BEFORE minification ==="
          echo "HTML: $(wc -c < index.html) bytes"
          echo "CSS total: $(find asset/css -name "*.css" -exec wc -c {} + | tail -1 | awk '{print $1}') bytes"
          echo "JS total: $(find . -name "*.js" -not -path "./node_modules/*" -exec wc -c {} + | tail -1 | awk '{print $1}') bytes"

      - name: Minify CSS files
        run: |
          echo "Starting CSS minification..."
          for file in asset/css/*.css; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Processing: $filename"
              # Use level 1 optimization (safe, no structural changes)
              cleancss \
                --level 1 \
                -o "$file.tmp" "$file" && mv "$file.tmp" "$file" || echo "Failed to minify $filename"
            fi
          done
          echo "CSS minification complete"

      - name: Minify JavaScript files
        run: |
          echo "Starting JavaScript minification..."

          # Minify src directory JS files
          if [ -d "src" ]; then
            find src -name "*.js" -type f | while read file; do
              echo "Processing: $file"
              terser "$file" -o "$file.tmp" --compress --mangle && mv "$file.tmp" "$file" || echo "Failed to minify $file"
            done
          fi

          # Minify root JS files (carousel.js, sw.js)
          for file in *.js; do
            if [ -f "$file" ]; then
              echo "Processing: $file"
              terser "$file" -o "$file.tmp" --compress --mangle && mv "$file.tmp" "$file" || echo "Failed to minify $file"
            fi
          done

          echo "JavaScript minification complete"

      - name: Minify HTML
        run: |
          echo "Starting HTML minification..."
          html-minifier-terser \
            --collapse-whitespace \
            --conservative-collapse \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            --keep-closing-slash \
            --preserve-line-breaks \
            -o index.html.tmp \
            index.html

          if [ -f "index.html.tmp" ]; then
            mv index.html.tmp index.html
            echo "HTML minified successfully"
          else
            echo "HTML minification failed, using original"
          fi

      - name: Inject build date into HTML (after minification)
        run: |
          sed -i "s/__BUILD_DATE__/${{ steps.date.outputs.BUILD_DATE }}/g" index.html
          echo "Build date injected: ${{ steps.date.outputs.BUILD_DATE }}"
          # Verify it was replaced
          grep "Build:" index.html || echo "WARNING: Build date not found in HTML"

      - name: Check file sizes after minification
        run: |
          echo "=== File sizes AFTER minification ==="
          echo "HTML: $(wc -c < index.html) bytes"
          echo "CSS total: $(find asset/css -name "*.css" -exec wc -c {} + | tail -1 | awk '{print $1}') bytes"
          echo "JS total: $(find . -name "*.js" -not -path "./node_modules/*" -exec wc -c {} + | tail -1 | awk '{print $1}') bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
