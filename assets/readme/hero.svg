<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">KMMX Control Panel</title>
  <desc id="desc">Web Bluetooth control panel for the KMMX-Fursuit. The fursuit's LED face, drawn as a dot matrix using the app's real Idle eye and viseme mouth shapes.</desc>
  <defs>
    <pattern id="led" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.4" fill="#ff446c"/>
    </pattern>
    <pattern id="led-off" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.2" fill="#1e1a22"/>
    </pattern>
    <pattern id="led-mouth" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.4" fill="#d8d8d8"/>
    </pattern>
    <clipPath id="eye">
      <path transform="translate(790 70) scale(0.62)" d="m506.74 150.56.26 175.07H254.63s204.03-15.27 252.12-175.07ZM507 0S204.97-1.76 0 203.21c0 0 214.36 115.76 404.26 5.69C483.28 163.11 507 0 507 0Z"/>
    </clipPath>
    <clipPath id="mouth">
      <path transform="translate(744 280) scale(0.4 0.55)" d="M0 54.06c224-.5 114 118.5 284.87 0 175.76-121.89 95.13.5 266.53 0 174.6-.51 68.6 74.5 169.6 2.68 156.32-111.15 67-4.18 285-2.98"/>
    </clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ff446c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff446c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#0b0b0c"/>

  <g id="title-block">
    <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#ff446c">WEB BLUETOOTH · INSTALLABLE PWA</text>
    <text x="60" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#ffffff">KMMX</text>
    <text x="64" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="300" fill="#ffffff">Control Panel</text>
    <text x="64" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#c6c6c6">Your fursuit's LED face, on your phone.</text>
    <text x="64" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#606060">kimmix-control.anthro.asia</text>
  </g>

  <g id="led-face">
    <rect x="700" y="40" width="452" height="320" rx="22" fill="#0e0b16" stroke="#16161a" stroke-width="2"/>
    <rect x="700" y="40" width="452" height="320" rx="22" fill="url(#glow)"/>
    <rect x="718" y="58" width="416" height="284" fill="url(#led-off)"/>
    <rect x="718" y="58" width="416" height="284" fill="url(#led)" clip-path="url(#eye)"/>
    <rect x="718" y="58" width="416" height="284" fill="url(#led-mouth)" clip-path="url(#mouth)"/>
  </g>
</svg>
